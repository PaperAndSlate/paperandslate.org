    type: judge
    assignee: Judge
    status: done
    reasoning_hint: high
    objective: "Review T001 evidence and select the first bounded repository-controlled remediation package with exact write scope and verification."
    inputs:
      - "T001 receipt"
      - "Current CI/workflows and container/browser scripts"
      - "User-supplied hosted-validation requirements"
    constraints:
      - "Read-only; do not implement."
      - "Preserve pre-existing documentation edits and do not weaken gates."
      - "Separate repository-controlled work from provider, hosted-runner, deployment, and human blockers."
    expected_output:
      - "Decision and rationale"
      - "Exact Worker/PM objective"
      - "allowed_files"
      - "verify"
      - "stop_if"
      - "Deferred or external gates"
    receipt:
      result: done
      decision: approved
      full_outcome_complete: false
      summary: "Approve one cohesive P0 slice: remove host-loopback dependence from container health probing and make CI browser execution explicitly non-root, preserving thresholds and failure truth."
      worker_package:
        objective: "Implement and verify bounded container-health probing with topology-independent in-container checks, cleanup, timeout, identity, and evidence preservation; make Forgejo and GitHub browser/Lighthouse verification execute through an explicitly unprivileged CI browser path using the installed Playwright Chromium; add focused failure coverage without changing thresholds or hosted/provider behavior."
        allowed_files:
          - ".forgejo/workflows/container.yml"
          - ".forgejo/workflows/lighthouse.yml"
          - ".forgejo/workflows/quality.yml"
          - ".github/workflows/ci.yml"
          - "scripts/container-check.ts"
          - "scripts/ci-browser.ts"
          - "scripts/wrapper-failure-fixture.ts"
        verify:
          - "pnpm exec prettier --check .forgejo/workflows/container.yml .forgejo/workflows/lighthouse.yml .forgejo/workflows/quality.yml .github/workflows/ci.yml scripts/container-check.ts scripts/ci-browser.ts scripts/wrapper-failure-fixture.ts"
          - "pnpm typecheck"
          - "pnpm wrappers:failure"
          - "pnpm container:check"
          - "pnpm install --frozen-lockfile"
          - "pnpm exec playwright install --with-deps chromium"
          - "pnpm verify"
        stop_if:
          - "Required change falls outside the allowed files."
          - "Browser execution requires --no-sandbox, disabled sandboxing, skipped checks, or weakened thresholds."
          - "Runner cannot provide a verifiable unprivileged browser path."
          - "Container probing still depends on host loopback or an unbounded Docker command, or exact identity is lost."
          - "Docker is unavailable or verification fails twice without an isolated repository-controlled cause."
          - "Any pre-existing documentation edit is reformatted, overwritten, or otherwise changed."
      evidence:
        - "notes/T001-receipt.md"
        - "CI runs 61/container, 62/Lighthouse, and 63/quality failed"
        - "Current container-check.ts probes a published host loopback port"
        - "Current Lighthouse failure launches Chrome as root without a sandbox"
      missing_evidence:
        - "Fresh successful exact-SHA hosted CI reruns for container, Lighthouse, and quality"
        - "Staging providerReady=true with immutable OCI image digest and deployed-digest evidence"
        - "Image delivery and route-specific og:url correction evidence"
        - "Provider observability, SLO, rollback, signing/provenance, release-tag, and human/publication approvals"
