version: 2

goal:
  title: "Paper & Slate Web — RC3 Engineering Closure"
  slug: "paperandslate-web-rc3-engineering-closure"
  kind: existing_plan
  tranche: "Continuous execution of hosted-validation readiness and RC3 engineering closure until all repository-controlled work is complete and remaining external gates are explicit."
  status: active
  oracle:
    signal: "Current CI/workflows, release/staging evidence, readiness reports, executable checks, and final audit agree about every repository-controlled item and every external blocker."
    cadence: "after each Worker package and at final audit"
    final_proof: "Final Judge/PM receipt maps current source, evidence identities, checks, and remaining blockers to the full request with full_outcome_complete: true; no required safe local task remains queued or active."
  intake:
    original_request: "Create and execute Paper & Slate Web — RC3 Engineering Closure until the repository is ready for hosted validation, with accurate evidence and no unsupported external claims."
    interpreted_outcome: "Make the Web RC3 repository and its CI/release/staging evidence genuinely ready for hosted validation, fixing repository-controlled defects and accurately documenting unavailable external gates."
    input_shape: existing_plan
    audience: "maintainers, reviewers, hosted CI operators, release owners, and future public-site users"
    authority: requested
    proof_type: artifact
    completion_proof: "Exact identities, current evidence, safe repository changes, applicable verification, and a final audit leave only evidenced external or human blockers."
    likely_misfire: "Treating stale local prose or a narrow green check as complete hosted-validation readiness."
    blind_spots_considered:
      - "Pre-existing modified release-closure documents"
      - "Private Forgejo/Tower remote and unavailable hosted execution or credentials"
      - "Platform-specific path, shell, line-ending, symlink, archive, locale, and package-manager behavior"
      - "Stale RC3 reports and evidence identity drift"
      - "Dependency-originated versus first-party DEP0169 warning"
      - "Provider, observability, OCI, signing, rollback, and production/human gates"
    existing_plan_facts:
      - "Authoritative source revision: 06491dc is the current release branch HEAD at intake; preserve user-supplied historical identities unless new evidence supersedes them."
      - "Inspect CI runs 61, 62, and 63 and current staging deployment evidence before changing claims."
      - "Cover Linux, Windows, macOS, supported Node versions, frozen install, build, quality, tests, browser/Lighthouse, packages, schemas/modules/fixtures, conformance, examples, deterministic generation, docs, policy, reproducibility, and traceability where technically appropriate."
      - "Do not push, tag, release, deploy, publish, submit to IANA, or complete external gates without actual evidence."

rules:
  pm_owns_state: true
  one_active_task: true
  max_write_workers: 1
  no_implementation_without_worker_or_pm_task: true
  no_completion_without_judge_or_pm_audit: true
  planning_is_not_completion: true
  queued_required_worker_blocks_completion: true
  continuous_until_full_outcome: true
  missing_input_or_credentials_do_not_stop_goal: true
  exact_human_approval_can_terminal_wait: true
  preserve_and_validate_existing_plan: true
  intake_misfire_must_be_audited: true
  goal_pressure_requires_oracle: true
  no_completion_on_weak_proof: true
  slice_policy:
    max_consecutive_tiny_tasks: 2
    prefer_vertical_slices: true
    judge_picks_largest_safe_slice: true
    worker_completes_whole_slice: true

agents:
  scout: installed
  worker: installed
  judge: installed

visual_board:
  selected: local
  local:
    status: not_requested
    url: null
    command: "node C:/Users/Callum/.codex/plugins/cache/goalbuddy/goalbuddy/0.4.3/skills/goal-prep/surfaces/local-goal-board/scripts/local-goal-board.mjs --goal docs/goals/paperandslate-web-rc3-engineering-closure"

active_task: T999

tasks:
  - id: T001
    type: pm
    assignee: PM
    status: done
    reasoning_hint: high
    objective: "Reconstruct the exact current Web RC3 release, CI, staging, evidence, capability, and worktree state; identify repository-controlled fixes and the first safe implementation package without changing product files during discovery."
    inputs:
      - "Current git branch, commits, remotes, worktree, and pre-existing diff"
      - "RC3 readiness, handoff, owner-action, implementation, audit, and security documents"
      - ".github and .forgejo workflows, package scripts, release tooling, and evidence directories"
      - "Hosted CI/staging/observability capability available in the current environment"
      - "User-supplied RC3 source/evidence/scan identities"
    constraints:
      - "Read-only discovery until the first implementation package is explicitly activated."
      - "Do not print secrets or replace pre-existing user edits."
      - "Use exact file-path and command evidence; separate historical, local, hosted, provider, and human evidence."
    expected_output:
      - "Exact release and evidence identity map"
      - "Current worktree and pre-existing edit inventory"
      - "CI/workflow and environment capability map"
      - "Ranked repository-controlled defects and external blockers"
      - "First safe implementation package with allowed files and verification"
    receipt:
      result: done
      note: notes/T001-receipt.md
      summary: "RC3 is not closure-ready: local/upstream 06491dc agree, exact CI runs 61–63 failed, source-build staging b4c1jatqaidljtcpc4nly1yp is identity-verified but providerReady=false and has no OCI digest, hosted evidence is partial, and generated evidence is stale or failed. First safe package is bounded container-probe and secure-browser CI remediation."
      evidence:
        - "notes/T001-receipt.md"
        - "git status --short --branch; git log -8 --oneline --decorate; git remote -v"
        - "LAUNCH_READINESS.md; RELEASE_EVIDENCE_HANDOFF.md; RC3_REMEDIATION_AND_OWNER_ACTION_PLAN.md"
        - ".generated/launch/repository-identity.json; .generated/launch/verify.json; .generated/launch/container-check.json; .generated/launch/staging-publication.json"
