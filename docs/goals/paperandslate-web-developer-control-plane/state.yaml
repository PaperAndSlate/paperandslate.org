version: 2

goal:
  title: "Paper & Slate Web — Developer Control Plane"
  slug: "paperandslate-web-developer-control-plane"
  kind: existing_plan
  tranche: "DCP-1A repository-only fixture-gated control-plane kernel."
  status: blocked
  oracle:
    signal: "Plans, ADR, interface receipt, Tower intent, isolated requirements, generated ledger, verification, and final review agree while RC3 evidence remains unchanged."
    cadence: "after Implementer, Executor, and Reviewer/Integrator"
    final_proof: "A final Reviewer/Integrator receipt accepts DCP-0 with no application code or external mutation and records all later dependencies."
  intake:
    original_request: "Add a future Developer Control Plane as a controlled non-production expansion beyond RC3."
    interpreted_outcome: "Accept the identity/API-key architecture and cross-project contract before implementation, without changing RC3 history or external systems."
    input_shape: existing_plan
    audience: "Web and Data Platform maintainers, security reviewers, and future control-plane operators"
    authority: requested
    proof_type: artifact
    completion_proof: "Reviewed architecture and interface artifacts plus executable isolated traceability."
    likely_misfire: "Starting authentication or inventing API-key cryptography before ownership and verifier contracts are accepted."
    blind_spots_considered:
      - "RC3 identity and evidence contamination"
      - "Human identity versus machine credential separation"
      - "Project binding and organization RBAC"
      - "Revocation staleness, rotation overlap, and fail-closed behavior"
      - "Secrets, logging, analytics, and evidence redaction"
      - "Tower resource and repository authority"
    existing_plan_facts:
      - "D-018 excludes authentication and API keys from the public-site/RC3 phase."
      - "The owner has now authorized a later non-production Developer Control Plane phase."
      - "Data Platform requires organization → project → key ownership and reuses Web human identity."

rules:
  pm_owns_state: true
  one_active_task: true
  max_write_workers: 1
  no_implementation_without_worker_or_pm_task: true
  no_completion_without_judge_or_pm_audit: true
  planning_is_not_completion: true
  queued_required_worker_blocks_completion: true
  continuous_until_full_outcome: false
  missing_input_or_credentials_do_not_stop_goal: true
  exact_human_approval_can_terminal_wait: true
  preserve_and_validate_existing_plan: true
  intake_misfire_must_be_audited: true
  goal_pressure_requires_oracle: true
  no_completion_on_weak_proof: true
  slice_policy:
    max_consecutive_tiny_tasks: 2
    prefer_vertical_slices: true
    judge_picks_largest_safe_slice: true
    worker_completes_whole_slice: true

agents:
  scout: installed
  worker: installed
  judge: installed

