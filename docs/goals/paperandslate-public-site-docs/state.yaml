version: 2

goal:
  title: "Paper & Slate Public Website and Documentation System"
  slug: "paperandslate-public-site-docs"
  kind: existing_plan
  tranche: "Continuous execution of the supplied Paper & Slate launch plan until the full local outcome is implemented and verified."
  status: active
  oracle:
    signal: "Implementation ledger, working app, generated artifacts, verification receipts, and final launch-readiness audit cover every launch requirement or identify only genuine external blockers."
    cadence: "after each Worker package and at final audit"
    final_proof: "Final Judge/PM receipt maps current implementation and verification to the complete brief with full_outcome_complete: true; no required Worker remains queued or active."
  intake:
    original_request: "/goal with the pasted Paper & Slate public website and unified documentation system completion brief."
    interpreted_outcome: "Build and verify the full local Paper & Slate public site, docs system, content/ingestion/search/governance/publishing/operations foundations, and truthful readiness artifacts without unauthorized remote changes."
    input_shape: existing_plan
    audience: "developers, educators, schools and districts, education software companies, data organizations, researchers, standards contributors, and the public"
    authority: requested
    proof_type: artifact
    completion_proof: "Working repository plus evidence-backed reports and verification that account for every supplied launch requirement."
    likely_misfire: "Stopping at a branded homepage or documentation shell while omitting the hard pipeline, governance, security, operational, and verification requirements."
    blind_spots_considered:
      - "Existing implementation and dirty worktree state"
      - "Authoritative planning-pack conflicts and missing assets"
      - "Missing real public facts, credentials, DNS, Tower, and remote repository access"
      - "Local versus browser, Docker, Lighthouse, provider, and production acceptance"
    existing_plan_facts:
      - "Read the complete planning pack and assets before app-code changes."
      - "Implement phases 0 through 7 plus launch-safe phase 8 features."
      - "Preserve truthful content and excluded technologies/flows."
      - "Do not commit, push, create remote repositories, or create pull requests."

rules:
  pm_owns_state: true
  one_active_task: true
  max_write_workers: 1
  no_implementation_without_worker_or_pm_task: true
  no_completion_without_judge_or_pm_audit: true
  planning_is_not_completion: true
  queued_required_worker_blocks_completion: true
  continuous_until_full_outcome: true
  missing_input_or_credentials_do_not_stop_goal: true
  exact_human_approval_can_terminal_wait: true
  preserve_and_validate_existing_plan: true
  intake_misfire_must_be_audited: true
  goal_pressure_requires_oracle: true
  no_completion_on_weak_proof: true
  slice_policy:
    max_consecutive_tiny_tasks: 2
    prefer_vertical_slices: true
    judge_picks_largest_safe_slice: true
    worker_completes_whole_slice: true

agents:
  scout: unknown
  worker: unknown
  judge: unknown

visual_board:
  selected: local
  local:
    status: not_requested
    url: null
    command: "node C:/Users/Callum/.codex/plugins/cache/goalbuddy/goalbuddy/0.4.3/surfaces/local-goal-board/scripts/local-goal-board.mjs --goal docs/goals/paperandslate-public-site-docs"

