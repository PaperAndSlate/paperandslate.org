    constraints:
      - "Read-only; do not edit implementation or product files."
      - "Preserve existing dirty worktree state and report it explicitly."
      - "Use concrete paths and evidence; do not infer missing planning-pack content."
    expected_output:
      - "Repository and existing-work summary"
      - "Complete planning-pack file and asset inventory"
      - "Requirements/conflicts that must shape the implementation ledger and ADRs"
      - "Available verification commands and environment limitations"
      - "Recommended first implementation slice"
    receipt:
      result: done
      summary: "Workspace is planning-only: no web application, package manifest, lockfile, git repository, or verification scripts exist under web. The authoritative pack is web/plans with 89 Markdown files and 64 assets; all Markdown was read and assets inventoried. The pack specifies a Next.js App Router pnpm/Turborepo monorepo with static-first content, docs ingestion, fallback search, and no database/auth. First safe Worker slice should bootstrap the repository and branded shell within explicit files."
      evidence:
        - "web/plans/README.md specifies one deployable Next.js application on paperandslate.org, docs at /docs, App Router, TypeScript, RSC, pnpm/Turborepo, Fumadocs, Zod, Typesense with static fallback, and Kit disabled until configured."
        - "web/plans/08-technical-architecture/02-repository-architecture.md defines apps/web, packages/design-system/content/docs-ingestion/search/config/testing, content/config/scripts/infrastructure/tests, and generated output boundaries."
        - "web/plans/11-implementation/01-phased-implementation-plan.md defines Phase 0 bootstrap through Phase 8, with Phase 0 exit requiring a blank branded shell and no database/auth dependencies."
        - "web/plans/10-quality-and-operations/03-testing-strategy.md specifies strict TypeScript, ESLint, schema/MDX/link/security checks, Vitest, Testing Library, Playwright, axe, Lighthouse, fixtures, and browser matrix."
        - "web/plans/05-content-and-publishing/03-kit-newsletter-integration.md requires server-only Kit integration and disabled/hidden behavior without credentials."
        - "web/plans/09-infrastructure-and-deployment/01-tower-development-infrastructure.md states the site is static-first, needs no database, and uses optional Typesense/Kit activation."
        - "web/plans/assets/README.md documents logos, brand board, mockups/source references, generated concepts, and production media licensing/optimization/alt-text requirements."
        - "Asset inventory: 64 files total: 1 CSS, 14 HTML, 9 JPG, 1 JSON, 1 README, 32 PNG, 6 SVG; complete paths are under web/plans/assets."
        - "web/plans/PACK_MANIFEST.md reports 151 files before manifests, 88 Markdown plans, 41 raster images, and 6 SVG logos; PACK_MANIFEST.json contains 151 entries."
        - "The board state marks T001 active and requires complete planning-pack inspection before application-code changes; no attachments directory was found outside the board's own plan location."
      facts:
        - "Current cwd is C:\\Users\\Callum\\Documents\\GitHub\\paperandslate\\web."
        - "web contains only docs/ and plans/ at top level."
        - "No package.json, pnpm-lock.yaml, pnpm-workspace.yaml, next.config, tsconfig, Vitest, Playwright, or application source exists under web."
        - "No .git directory exists in web or its immediate paperandslate parent; the only nearby git repository is paperandslate/well-known/.git."
        - "The board canonical path is web/docs/goals/paperandslate-public-site-docs/state.yaml."
        - "All 89 Markdown files under plans were read programmatically; aggregate size was 255,996 characters and approximately 36,550 words."
        - "The plan pack recommends no authentication, database/ORM, PostgreSQL, queues, or other excluded infrastructure."
        - "Recommended first Worker slice: create the bounded Phase 0 repository/workspace bootstrap plus minimal branded shell, package manifests, strict TypeScript/lint/format/test scaffolding, environment schema, and ADR/ledger placeholders only where explicitly authorized by Judge."
      contradictions:
        - "PACK_MANIFEST.md says 151 files before manifest and 88 Markdown plans; the current plans tree contains 153 files including PACK_MANIFEST.md/json and 89 Markdown files including README.md and assets/README.md. This is explainable by manifest self-exclusion/README counting, but should be reconciled before relying on counts."
        - "The planning pack describes a future pnpm/Turborepo Next.js repository, while the current web workspace has no application or package architecture to inspect."
        - "The board input requests planning-pack candidates in parents/mounted/common attachment locations, but no separate attachments directory or parent-level Paper & Slate web plan was found."
      ambiguity_requiring_judge:
