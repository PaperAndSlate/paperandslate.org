        - "The pack recommends current stable Next.js and Node LTS but intentionally does not pin versions; Worker/Judge must choose versions and record them."
        - "The intended git repository boundary is unclear because web is not itself a git checkout and the parent paperandslate directory is also not a git checkout."
      commands:
