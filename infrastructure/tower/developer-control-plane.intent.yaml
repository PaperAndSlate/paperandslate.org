version: 1
kind: developer-control-plane-database-intent
status: disabled-non-applicable
application: paper-and-slate-developer-control-plane
authority: planning-only
apply: prohibited
reason: >-
  DCP-0 records no Tower resource schema or deployment authority. A future approved
  implementation must choose topology, region, backup/restore, retention, and migration controls.
secret_references_only:
  database_url: DCP_IDENTITY_CONTROL_DATABASE_URL
  database_encryption_key: DCP_IDENTITY_CONTROL_DATABASE_ENCRYPTION_KEY
constraints:
  - Do not add this resource to .tower/project.yaml.
  - Do not provision, apply, deploy, or resolve secret values.
  - Keep the identity/control database logically Web-owned and separate from Data Platform state.
