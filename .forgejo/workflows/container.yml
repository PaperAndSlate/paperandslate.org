name: Container

on:
  workflow_dispatch:
  push:
    branches:
      - release/v1-closure

jobs:
  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.6.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm docs:bundle:check
      - run: pnpm container:check
        env:
          RELEASE_ID: ci-${{ github.sha }}
          GIT_SHA: ${{ github.sha }}
          DEPLOYMENT_ENV: ci
      - run: pnpm sbom:generate
        env:
          RELEASE_ID: ci-${{ github.sha }}
          GIT_SHA: ${{ github.sha }}
          DEPLOYMENT_ENV: ci
      - uses: https://code.forgejo.org/actions/upload-artifact@v4
        if: always()
        with:
          name: paper-and-slate-container-${{ github.sha }}
          path: |
            evidence/local/sbom/
            .generated/launch/container-check.json
            .generated/launch/docs-bundle-check.json
          if-no-files-found: warn
