name: Container

on:
  workflow_dispatch:
  push:
    branches:
      - release/v1-closure

permissions:
  contents: read

concurrency:
  group: forgejo-container-${{ github.ref }}
  cancel-in-progress: true

jobs:
  container:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda # v4.1.0
        with:
          version: 10.6.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm docs:bundle:check
      - run: pnpm container:check
        env:
          RELEASE_ID: ci-${{ github.sha }}
          GIT_SHA: ${{ github.sha }}
          DEPLOYMENT_ENV: ci
      - run: pnpm sbom:generate
        env:
          RELEASE_ID: ci-${{ github.sha }}
          GIT_SHA: ${{ github.sha }}
          DEPLOYMENT_ENV: ci
      - uses: https://code.forgejo.org/actions/upload-artifact@c6a366c94c3e0affe28c06c8df20a878f24da3cf # v3.2.2
        if: always()
        with:
          name: paper-and-slate-container-${{ github.sha }}
          path: |
            evidence/local/sbom/
            .generated/launch/container-check.json
            .generated/launch/docs-bundle-check.json
          if-no-files-found: warn
          retention-days: 14
