name: Quality

on:
  push:
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.6.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm verify
        env:
          NEXT_PUBLIC_SITE_URL: http://127.0.0.1:3101
          RELEASE_ID: ci-${{ github.sha }}
      - run: pnpm evidence:bundle
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: paper-and-slate-quality-${{ github.sha }}
          path: |
            evidence/
            playwright-report/
            test-results/
          if-no-files-found: warn
