name: Lighthouse

on:
  workflow_dispatch:
  push:
    branches:
      - release/v1-rc

jobs:
  lighthouse:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.6.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm docs:ingest
      - run: pnpm search:index
      - run: pnpm build
      - run: pnpm lighthouse
      - run: pnpm performance:check
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: paper-and-slate-lighthouse-${{ github.sha }}
          path: .generated/launch/lighthouse/
          if-no-files-found: warn
