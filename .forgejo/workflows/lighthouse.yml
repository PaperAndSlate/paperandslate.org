name: Lighthouse

on:
  workflow_dispatch:
  push:
    branches:
      - release/v1-closure

jobs:
  lighthouse:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.6.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm docs:bundle:check
      - run: pnpm search:index
      - run: pnpm build:web
      - run: pnpm lighthouse
        env:
          RELEASE_ID: ci-${{ github.sha }}
          GIT_SHA: ${{ github.sha }}
          DEPLOYMENT_ENV: ci
      - run: pnpm performance:check
      - uses: https://code.forgejo.org/actions/upload-artifact@v4
        if: always()
        with:
          name: paper-and-slate-lighthouse-${{ github.sha }}
          path: .generated/launch/lighthouse/
          if-no-files-found: warn
