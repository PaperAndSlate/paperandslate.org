name: Lighthouse

on:
  workflow_dispatch:
  push:
    branches:
      - release/v1-closure

permissions:
  contents: read

concurrency:
  group: forgejo-lighthouse-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lighthouse:
    runs-on: playwright
    timeout-minutes: 45
    env:
      CI_BROWSER_EXPECTED_USER: pwuser
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@7088e561eb65bb68695d245aa206f005ef30921d # v4.1.0
        with:
          version: 10.6.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install chromium
      - run: pnpm docs:bundle:check
      - run: pnpm search:index
      - run: pnpm build:web
      - run: pnpm exec tsx scripts/ci-browser.ts lighthouse
        env:
          RELEASE_ID: ci-${{ github.sha }}
          GIT_SHA: ${{ github.sha }}
          DEPLOYMENT_ENV: ci
      - run: pnpm performance:check
      - uses: https://code.forgejo.org/actions/upload-artifact@c6a366c94c3e0affe28c06c8df20a878f24da3cf # v3.2.2
        if: always()
        with:
          name: paper-and-slate-lighthouse-${{ github.sha }}
          path: .generated/launch/lighthouse/
          if-no-files-found: warn
          retention-days: 14
