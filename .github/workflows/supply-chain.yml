name: Supply chain and release evidence

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: supply-chain-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  supply-chain:
    name: Supply chain / Ubuntu / Node 24
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      DEPLOYMENT_ENV: ci
      GIT_SHA: ${{ github.sha }}
      RELEASE_ID: ci-${{ github.sha }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@7088e561eb65bb68695d245aa206f005ef30921d # v4.1.0
        with:
          version: 10.6.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.17.0
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm actions:check
      - run: pnpm traceability:check
      - run: pnpm docs:bundle:check
      - run: pnpm content:validate
      - run: pnpm feeds:check
      - run: pnpm release:check
      - run: pnpm security:check
      - run: pnpm security:scan
      - run: pnpm vulnerability:scan
      - run: pnpm license:check
      - run: pnpm packages:check
      - run: pnpm verify:release-reproducibility
      - run: pnpm sbom:generate
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: paper-and-slate-supply-chain-${{ github.sha }}
          path: |
            evidence/local/
            .generated/launch/
            .generated/requirements/
            .generated/docs/
            .generated/search/
          if-no-files-found: warn
          retention-days: 14
