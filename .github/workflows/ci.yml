name: CI

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 10.6.0 }
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm verify
        env:
          NEXT_PUBLIC_SITE_URL: http://127.0.0.1:3101
          RELEASE_ID: ci-${{ github.sha }}
  launch-hardening:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 10.6.0 }
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm security:check
      - run: pnpm seo:check
      - run: pnpm docs:ingest
      - run: pnpm search:index
      - run: pnpm build
      - run: pnpm lighthouse
      - run: pnpm performance:check
      - run: pnpm rollback:check
